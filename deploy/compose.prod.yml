services:
  redis:
    image: redis:7-alpine
    container_name: billing-agent-redis
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: billing-agent-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env.production
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      - redis

  api:
    image: ${BILLING_IMAGE}
    container_name: billing-agent-api
    restart: unless-stopped
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env.production
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - litellm

  mcp-server:
    image: ${BILLING_IMAGE}
    container_name: billing-agent-mcp
    restart: unless-stopped
    command: ["uvicorn", "mcp_server.http_api:app", "--host", "0.0.0.0", "--port", "9000"]
    env_file:
      - .env.production
    ports:
      - "9000:9000"
